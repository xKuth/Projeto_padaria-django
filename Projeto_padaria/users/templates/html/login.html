<!DOCTYPE html>
{% extends 'html/bases.html' %}
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/mobile.css'  %}" alt="css_max768">
    <link rel="stylesheet" href="{% static 'css/desktop.css' %}" type="text/css" alt="css_max1300">
    <title>Logon</title>
</head>
<body>
    {% block header %}
    <main>
        <section class="section_login">
            <form action="{% url 'logon'}" method="post">

                {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="Username" class="form-label">Úsuario:</label>
                        {{ formu.password_form }}
                        <div id="emailHelp" class="form-text">Dígite o nome do úsuario:</div>
                        <label for="Password" class="form-label">Senha:</label>
                        {{ formu.password_form }}
                        <div id="emailHelp" class="form-text">Dígite a senha do úsuario:</div>
                        <br>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>

            </form>
        </section>
            
    </main>
    {% endblock header %}
    {% block footer %}{% endblock footer %}
</body>
</html>
