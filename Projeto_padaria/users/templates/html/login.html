<!DOCTYPE html>
{% extends 'html/bases.html' %}
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/mobile.css'  %}" alt="css_max768">
    <link rel="stylesheet" href="{% static 'css/desktop.css' %}" type="text/css" alt="css_max1300">
    <title>Logon</title>
</head>
<body>
    {% block header %}
    <main>
        <section class="section_enterprise">
            <div class="mb-3">
                <form action="">
                    <label for="Username" class="form-label">Úsuario</label>
                    <input type="text" class="form-control" aria-describedby="Nome de Úsuario">
                    <div id="emailHelp" class="form-text">Dígite o nome do úsuario</div>
                </form>
            </div>
            <div class="mb-3">
                <label for="Password" class="form-label">Senha</label>
                <input type="password" class="form-control" aria-describedby="Senha">
                <div id="emailHelp" class="form-text">Dígite sua senha</div>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </section>
            
    </main>
    {% endblock header %}
    {% block footer %}{% endblock footer %}
</body>
</html>
